---
- name: Configure Node.js server
  hosts: webservers
  become: true

  vars:
    app_repo_url: "https://github.com/amaldev-devops/nodejs-automation.git"
    app_directory: "/opt/nodejs-automation"
    deploy_public_key: "{{ lookup('ansible.builtin.file', '/root/.ssh/nodejs-key.pub') }}"

  roles:
    - role: base
      tags: [base]

    - role: ssh
      tags: [ssh]

    - role: nodejs
      tags: [nodejs]

    - role: nginx
      tags: [nginx]

    - role: app
      tags: [app]

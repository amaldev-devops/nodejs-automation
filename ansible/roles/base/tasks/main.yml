---
- name: update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: install basic utilities
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - ca-certificates
    state: present
